name: Publish games

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - '**/*.md'
      - '**/*.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

# Finish the active deployment before publishing another commit.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package static games
        run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static games
        id: deployment
        uses: actions/deploy-pages@v4
