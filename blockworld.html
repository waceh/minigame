<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>블록 아일랜드 · Godot 3D</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; background: #102e33; overflow: hidden; }
        #canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
        #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; color: #e9c57f; background: #102e33; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }
        #loading[hidden] { display: none; }
        progress { width: 240px; accent-color: #e9c57f; }
    </style>
</head>
<body>
    <a href="index.html" style="position:fixed;right:20px;top:72px;z-index:5;color:#fff1ca;font:13px system-ui;text-decoration:none">← 목록</a>
    <canvas id="canvas" tabindex="0" aria-label="블록 아일랜드 게임">브라우저가 게임 화면을 지원하지 않습니다.</canvas>
    <div id="loading" role="status"><span id="loadMessage">나만의 작은 섬을 만드는 중…</span><progress id="progress"></progress></div>
    <!-- Godot 4.5 runtime is shared with sky-steps; only this game's pack is new. -->
    <script src="jumpking/web/index.js"></script>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        const gameCanvas = document.getElementById('canvas');
        let captureWanted = false;
        let capturePending = false;
        async function captureMouse() {
            if (!captureWanted || capturePending || document.pointerLockElement === gameCanvas) return;
            capturePending = true;
            try {
                gameCanvas.focus();
                await gameCanvas.requestPointerLock();
            } catch (error) {
                gameCanvas.dataset.captureError = error.name;
                window.blockIslandPointer?.(false, true);
            } finally { capturePending = false; }
        }
        window.blockIslandSetCapture = enabled => {
            captureWanted = enabled;
            if (enabled) captureMouse();
            else if (document.pointerLockElement === gameCanvas) document.exitPointerLock();
        };
        document.addEventListener('pointerlockchange', () => {
            gameCanvas.dataset.pointerLocked = String(document.pointerLockElement === gameCanvas);
            window.blockIslandPointer?.(document.pointerLockElement === gameCanvas, false);
        });
        gameCanvas.addEventListener('mousedown', event => {
            if (captureWanted && document.pointerLockElement !== gameCanvas) {
                event.stopImmediatePropagation();
                captureMouse();
            }
        }, true);
        window.addEventListener('pagehide', () => window.blockIslandSetCapture(false));
        const engine = new Engine({
            executable: 'jumpking/web/index', mainPack: 'blockworld/web/index.pck?v=1.1.0',
            canvas: gameCanvas, canvasResizePolicy: 2, focusCanvas: true, args: [], gdextensionLibs: []
        });
        engine.startGame({onProgress(current, total) {
            const progress = document.getElementById('progress');
            if (total) { progress.max = total; progress.value = current; }
        }}).then(() => { document.getElementById('loading').hidden = true; }).catch(error => {
            document.getElementById('loadMessage').textContent = '게임을 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.';
            document.getElementById('progress').hidden = true;
            console.error(error);
        });
    </script>
</body>
</html>
