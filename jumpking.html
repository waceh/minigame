<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하늘 발판 | 미니게임</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #101c30; color: #f7e8bb; font-family: Arial, sans-serif; }
        main { max-width: 1040px; margin: 0 auto; padding: 24px; }
        a { color: #a7d5cf; }
        h1 { margin: 18px 0 8px; }
        p { color: #c5d4e8; line-height: 1.5; }
        iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 2px solid #537b88; border-radius: 10px; background: #14233b; }
        .game-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
        button { min-height: 44px; padding: 8px 14px; border: 1px solid #a7d5cf; border-radius: 8px; background: #24445b; color: #f7e8bb; font-size: 1rem; }
        .mobile-tip { display: none; }
        @media (max-width: 700px), (pointer: coarse) {
            main { padding: 12px; }
            h1 { font-size: 1.5rem; }
            .mobile-tip { display: block; }
        }
    </style>
</head>
<body>
    <main>
        <a href="index.html">← 미니게임 목록</a>
        <h1>하늘 발판</h1>
        <div class="game-tools"><button type="button" id="fullscreenBtn">전체 화면</button><button type="button" id="restartBtn">다시 시작</button></div>
        <iframe id="gameFrame" src="jumpking/web/index.html" title="하늘 발판 Godot 게임" allow="autoplay; fullscreen"></iframe>
        <p class="mobile-tip">휴대폰에서는 화면의 ◀ ▶ 버튼으로 이동하고, ▲ 버튼을 누른 채 방향을 정한 뒤 떼어 점프합니다. 가로 화면과 전체 화면을 권장합니다.</p>
        <p>발판을 딛고 정상까지 올라가세요. A/D 또는 ←/→로 자리를 잡고, 스페이스를 누른 채 방향을 정한 다음 떼어 점프하세요. 충전 중에는 걷지 못하고 공중에서도 방향을 바꿀 수 없습니다. 실패하면 아래로 떨어집니다.</p>
    </main>
    <script>
        const gameFrame = document.getElementById('gameFrame');
        document.getElementById('fullscreenBtn').addEventListener('click', () => gameFrame.requestFullscreen?.());
        document.getElementById('restartBtn').addEventListener('click', () => { gameFrame.src = gameFrame.src; });
    </script>
</body>
</html>
