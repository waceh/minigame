<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하늘 발판 | 미니게임</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #101c30; color: #f7e8bb; font-family: Arial, sans-serif; }
        main { max-width: 1040px; margin: 0 auto; padding: 24px; }
        a { color: #a7d5cf; }
        h1 { margin: 18px 0 8px; }
        p { color: #c5d4e8; line-height: 1.5; }
        iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 2px solid #537b88; border-radius: 10px; background: #14233b; }
        .game-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
        .game-shell { background: #101c30; }
        .game-shell:fullscreen, .game-shell:-webkit-full-screen, .fullscreen-fallback .game-shell {
            position: fixed; inset: 0; z-index: 1000; width: 100%; height: 100dvh;
            display: flex; flex-direction: column; padding: 8px; overflow: hidden;
        }
        .game-shell:fullscreen iframe, .game-shell:-webkit-full-screen iframe, .fullscreen-fallback .game-shell iframe {
            flex: 1; min-height: 0; height: 100%; aspect-ratio: auto; border-radius: 0;
        }
        .game-shell:fullscreen .game-tools, .game-shell:-webkit-full-screen .game-tools, .fullscreen-fallback .game-tools {
            flex: none; margin: 0 0 8px;
        }
        .rotate-hint { display: none; }
        @media (orientation: portrait) and (pointer: coarse) {
            .game-shell:fullscreen .rotate-hint, .game-shell:-webkit-full-screen .rotate-hint,
            .fullscreen-fallback .game-shell .rotate-hint {
                display: block; position: absolute; z-index: 2; top: 62px; left: 12px; right: 12px;
                padding: 10px; border-radius: 8px; background: rgba(16, 28, 48, 0.88);
                color: #f7e8bb; text-align: center; pointer-events: none;
            }
        }
        .fullscreen-fallback { overflow: hidden; }
        button { min-height: 44px; padding: 8px 14px; border: 1px solid #a7d5cf; border-radius: 8px; background: #24445b; color: #f7e8bb; font-size: 1rem; }
        .mobile-tip { display: none; }
        @media (max-width: 700px), (pointer: coarse) {
            main { padding: 12px; }
            h1 { font-size: 1.5rem; }
            .mobile-tip { display: block; }
        }
    </style>
</head>
<body>
    <main>
        <a href="index.html">← 미니게임 목록</a>
        <h1>하늘 발판</h1>
        <div class="game-shell" id="gameShell">
            <div class="game-tools"><button type="button" id="fullscreenBtn">전체 화면</button><button type="button" id="restartBtn">다시 시작</button></div>
            <iframe id="gameFrame" src="jumpking/web/index.html?v=1.1.24" title="하늘 발판 Godot 게임" allow="autoplay; fullscreen"></iframe>
            <div class="rotate-hint">가로 화면으로 플레이하려면 휴대폰을 돌려 주세요.</div>
        </div>
        <p class="mobile-tip">휴대폰에서는 ◀ ▶ 버튼으로 방향을 정하고, ▲ 버튼을 누른 뒤 떼면 바라보는 방향으로 점프합니다. 전체 화면에서 가로 방향으로 바뀌지 않으면 휴대폰을 돌려 주세요.</p>
        <p>높이 올라갈수록 좁아지는 발판을 딛고 정상까지 올라가세요. A/D 또는 ←/→로 방향을 정하고, 스페이스를 누른 뒤 떼면 바라보는 방향으로 점프합니다. 충전 중에는 걷지 못하고 공중에서도 방향을 바꿀 수 없습니다. 실패하면 아래로 떨어집니다.</p>
    </main>
    <script>
        const gameFrame = document.getElementById('gameFrame');
        const gameShell = document.getElementById('gameShell');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        function updateFullscreenLayout() {
            const expanded = document.fullscreenElement === gameShell || document.body.classList.contains('fullscreen-fallback');
            fullscreenBtn.textContent = expanded ? '전체 화면 종료' : '전체 화면';
            if (!expanded) screen.orientation?.unlock?.();
        }
        fullscreenBtn.addEventListener('click', async () => {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            } else if (document.body.classList.contains('fullscreen-fallback')) {
                document.body.classList.remove('fullscreen-fallback');
            } else {
                try {
                    if (!gameShell.requestFullscreen) throw new Error('Fullscreen API unavailable');
                    await gameShell.requestFullscreen();
                    if (matchMedia('(pointer: coarse)').matches && screen.orientation?.lock) {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                } catch {
                    document.body.classList.add('fullscreen-fallback');
                }
            }
            updateFullscreenLayout();
        });
        document.addEventListener('fullscreenchange', updateFullscreenLayout);
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && document.body.classList.contains('fullscreen-fallback')) {
                document.body.classList.remove('fullscreen-fallback');
                updateFullscreenLayout();
            }
        });
        document.getElementById('restartBtn').addEventListener('click', () => { gameFrame.src = gameFrame.src; });
    </script>
</body>
</html>
