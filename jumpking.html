<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101c30">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="하늘 발판">
    <title>하늘 발판</title>
    <link rel="manifest" href="jumpking.webmanifest">
    <link rel="apple-touch-icon" href="jumpking/web/index.apple-touch-icon.png">
    <link rel="stylesheet" href="css/jumpking.css?v=1.3.1">
    <script src="js/jumpking/mobile.js?v=1.3.1" defer></script>
</head>
<body>
    <main class="game-shell" id="gameShell">
        <section class="play-area" aria-label="하늘 발판 게임">
            <aside class="side-hud" aria-label="게임 정보와 메뉴">
                <h1>하늘 발판</h1>
                <span id="heightDisplay" aria-label="최고 높이">0 m</span>
                <button type="button" id="menuBtn" aria-haspopup="dialog" aria-controls="gameMenu">Ⅱ 메뉴</button>
                <button type="button" id="fullscreenBtn" aria-label="전체 화면">⛶ 화면</button>
            </aside>
            <div class="direction-pad touch-controls">
                <div class="joystick" id="joystick" role="slider" tabindex="0" aria-label="좌우 이동 조이스틱" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" aria-valuetext="가운데" aria-orientation="horizontal" aria-describedby="joystickHint">
                    <span class="joystick-arrow left" aria-hidden="true">‹</span>
                    <span class="joystick-arrow right" aria-hidden="true">›</span>
                    <span class="joystick-knob" id="joystickKnob" aria-hidden="true"></span>
                </div>
                <span class="control-caption" id="joystickHint">좌우로 밀어 이동</span>
            </div>
            <div class="game-viewport">
                <iframe id="gameFrame" src="jumpking/web/index.html?v=1.3.1" title="하늘 발판 게임" allow="autoplay; fullscreen" tabindex="0"></iframe>
            </div>
            <div class="jump-pad touch-controls">
                <div class="charge-label" id="chargeLabel">눌러서 충전</div>
                <div class="charge-track" role="progressbar" aria-label="점프 충전" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="chargeMeter"><div id="chargeFill"></div></div>
                <button class="control-button jump-button" type="button" data-action="jump" aria-label="길게 누른 뒤 떼서 점프">▲<span>점프</span></button>
                <span class="control-caption">떼면 점프!</span>
            </div>
        </section>
        <dialog id="gameMenu" aria-labelledby="menuTitle" aria-describedby="menuDescription">
            <div class="menu-card">
                <span class="menu-eyebrow">SKY STEPS</span>
                <h2 id="menuTitle">하늘 발판</h2>
                <p id="menuDescription">발판을 딛고 정상까지 올라가세요.</p>
                <p class="touch-instructions">왼손 조이스틱으로 방향을 정하고<br>오른손으로 점프를 꾹 눌렀다 떼세요.</p>
                <p class="keyboard-instructions">A/D 또는 ← → 이동 · 스페이스 충전 후 점프</p>
                <p class="menu-hint touch-instructions">가로 화면을 권장해요. 충전 중에도 방향을 바꿀 수 있어요.</p>
                <button class="primary-button" id="resumeBtn" type="button" disabled>게임 불러오는 중…</button>
                <button id="restartBtn" type="button" hidden>처음부터 다시 시작</button>
                <button id="installBtn" type="button" hidden>홈 화면에 설치</button>
                <p class="install-hint" id="installHint" hidden>Safari 공유 메뉴에서 ‘홈 화면에 추가’를 선택하세요.</p>
                <a class="menu-exit" href="index.html">미니게임 목록으로</a>
                <p class="load-status" id="loadStatus" role="status">게임을 준비하고 있습니다. 처음에는 잠시 걸릴 수 있어요.</p>
            </div>
        </dialog>
        <div class="sr-only" role="status" id="gameAnnouncement"></div>
    </main>
</body>
</html>
