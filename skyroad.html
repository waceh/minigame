<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070e28">
    <title>스카이로드</title>
    <style>
        html, body { margin: 0; min-height: 100%; background: #070e28; color: #c9e1f7; font: 14px system-ui; }
        body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }
        header { height: 42px; flex: 0 0 42px; display: flex; align-items: center; justify-content: space-between; width: min(100%, 1280px); }
        a { color: #8be9ff; text-decoration: none; padding: 0 14px; }
        iframe { border: 0; width: min(100vw, calc((100dvh - 42px) * 1.7778)); height: min(calc(100dvh - 42px), 56.25vw); background: #070e28; }
        @media (max-width: 700px) { iframe { width: 100vw; height: calc(100dvh - 42px); } }
    </style>
</head>
<body>
    <header><a href="index.html">← 게임 목록</a><span>스카이로드 &nbsp;</span></header>
    <iframe src="skyroad/web/index.html?v=1.0.2" title="스카이로드 게임" allow="autoplay; fullscreen"></iframe>

</html>
