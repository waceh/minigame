<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>스카이로드</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070e28;color:#d5e7ff;font:16px system-ui}#canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#070e28}#loading[hidden]{display:none}progress{width:240px;accent-color:#8be9ff}</style></head><body><canvas id="canvas" tabindex="0" aria-label="스카이로드 게임"></canvas><div id="loading" role="status"><span id="loadMessage">우주 도로를 만드는 중…</span><progress id="progress"></progress></div><script src="../../jumpking/web/index.js"></script><script>const engine=new Engine({executable:'../../jumpking/web/index',mainPack:'index.pck?v=1.0.1',canvasResizePolicy:2,focusCanvas:true,args:[],gdextensionLibs:[]});engine.startGame({onProgress(current,total){const progress=document.getElementById('progress');if(total){progress.max=total;progress.value=current}}}).then(()=>{document.getElementById('loading').hidden=true}).catch(error=>{document.getElementById('loadMessage').textContent='게임을 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.';document.getElementById('progress').hidden=true;console.error(error)});</script></body></html>
