<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>클럽 풋볼 11</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1828;color:#d2e5df;font:15px system-ui}canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#0c1828}#loading[hidden]{display:none}h1{letter-spacing:6px;font-size:32px;margin:0;color:#c6f365}small{color:#7e9caa}progress{width:280px;accent-color:#c6f365}a{color:#c6f365}#portrait{position:fixed;bottom:5px;width:100%;text-align:center;color:#b9d4ca;font-size:11px;pointer-events:none;display:none}@media(orientation:portrait)and(pointer:coarse){#portrait{display:block}}</style></head><body><canvas id="canvas" tabindex="0" aria-label="클럽 풋볼 11 게임"></canvas><div id="loading" role="status"><h1>CLUB FOOTBALL</h1><small>MATCHDAY / 11 V 11</small><span id="message">스타디움을 불러오는 중…</span><progress id="progress"></progress><small>첫 실행 시 게임 엔진 파일을 내려받습니다.</small></div><div id="portrait">가로 화면으로 돌리면 더 편하게 플레이할 수 있습니다.</div><script src="../../jumpking/web/index.js"></script><script>const engine=new Engine({executable:'../../jumpking/web/index',mainPack:'index.pck?v=2.0.0',canvasResizePolicy:2,focusCanvas:true,args:[],gdextensionLibs:[]});engine.startGame({onProgress(current,total){const p=document.getElementById('progress');if(total){p.max=total;p.value=current}}}).then(()=>{document.getElementById('loading').hidden=true;document.getElementById('canvas').focus()}).catch(error=>{document.getElementById('message').textContent='실행하지 못했습니다. WebGL 2를 지원하는 브라우저에서 새로고침해 주세요.';document.getElementById('progress').hidden=true;console.error(error)});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault()});</script></body></html>
